[package]
name = "repot-core"
version = "0.9.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
wait-timeout = "0.2"
# Reads plugin.xml from JetBrains plugin jars (plan 14). Pure-Rust inflate only.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1.49.0"
tempfile = "3"
