[package]
name = "repot-cli"
version = "0.9.0"
edition = "2024"
description = "Scan a development environment and export restore scripts from the command line"
license = "Apache-2.0"
repository = "https://github.com/junjuny0227/Repot"
publish = false

[[bin]]
name = "repot"
path = "src/main.rs"

[dependencies]
repot-core = { path = "../core" }
# Argument parsing and --help (plan 15).
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
