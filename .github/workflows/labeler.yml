name: Label PR

# pull_request_target runs with the base repo's token so it can label PRs from forks.
# It never checks out or runs PR code; actions/labeler only reads the PR metadata.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
