name: winget

# Sends each published release to the Windows Package Manager community repository
# (microsoft/winget-pkgs) as two packages: the desktop app (.msi) and the repot CLI (.zip).
# The first version of each was submitted by hand; this workflow uses it as the base and
# opens a pull request per package from the junjuny0227/winget-pkgs fork. Microsoft's
# validation and review decide when it appears in `winget install`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v0.9.0)
        required: true

permissions:
  contents: read

concurrency:
  group: winget
  cancel-in-progress: false

jobs:
  submit:
    # The token (classic PAT, public_repo + workflow) belongs to the account that owns the fork.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: junjuny0227.Repot
            installers-regex: '_x64_en-US\.msi$'
          - identifier: junjuny0227.RepotCLI
            installers-regex: '^repot-cli-.*-x86_64-pc-windows-msvc\.zip$'
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ${{ matrix.identifier }}
          installers-regex: ${{ matrix.installers-regex }}
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
