name: CI

on:
  # Docs-only changes do not affect builds or tests. No .md file outside docs/ is a
  # test input. If CI becomes a required check, switch to a job-level filter: a
  # skipped workflow never reports, so a required check would wait forever.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repot/desktop build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Install Scoop without elevation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install as a standard local account, never with -RunAsAdmin.
          $user = 'RepotScoop'
          $password = [guid]::NewGuid().ToString('N') + 'aA1!'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $user -Password $secure | Out-Null
          Add-LocalGroupMember -Group Users -Member $user
          $account = "$env:COMPUTERNAME\$user"
          # Scoop refuses a non-empty install dir, so the bootstrap script and logs
          # live next to it and $root itself is created by the installer.
          $base = 'C:\repot-ci'
          $root = Join-Path $base 'scoop'
          $work = Join-Path $base 'setup'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          icacls $base /grant "${account}:(OI)(CI)F" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot grant Scoop directory access' }
          $script = Join-Path $work 'install.ps1'
          $log = Join-Path $work 'install.log'
          @'
          $ErrorActionPreference = 'Stop'
          $env:SCOOP = '__SCOOP_ROOT__'
          # The child inherits runneradmin's profile variables; keep Scoop's config writable.
          $env:XDG_CONFIG_HOME = '__SCOOP_CONFIG__'
          Start-Transcript -Path '__SCOOP_LOG__'
          try {
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $principal = [Security.Principal.WindowsPrincipal]::new($identity)
            if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'Scoop must be installed with a non-admin token'
            }
            Write-Output 'Confirmed non-admin Scoop installation'
            Invoke-RestMethod https://get.scoop.sh | Invoke-Expression
            & "$env:SCOOP/shims/scoop.cmd" install jq ripgrep
            if ($LASTEXITCODE -ne 0) { throw 'Scoop package installation failed' }
          } catch {
            Write-Output ($_ | Out-String)
            exit 1
          } finally { Stop-Transcript }
          '@.Replace('__SCOOP_LOG__', $log).Replace('__SCOOP_ROOT__', $root).Replace('__SCOOP_CONFIG__', (Join-Path $base 'config')) | Set-Content $script
          $credential = [pscredential]::new($account, $secure)
          $stdout = Join-Path $work 'stdout.log'
          $stderr = Join-Path $work 'stderr.log'
          try {
            Start-Service seclogon
            $process = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$script`"" -Credential $credential -LoadUserProfile -WorkingDirectory $work -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $process.WaitForExit(300000)) {
              $process.Kill()
              throw 'Scoop setup timed out'
            }
            if ($process.ExitCode -ne 0) { throw "Scoop setup failed: $($process.ExitCode)" }
          } finally {
            foreach ($file in @($log, $stdout, $stderr)) {
              if (Test-Path $file) { Get-Content $file }
            }
            Remove-LocalUser -Name $user
          }
          "SCOOP=$root" >> $env:GITHUB_ENV
          "XDG_CONFIG_HOME=$(Join-Path $base 'config')" >> $env:GITHUB_ENV
          "$root/shims" >> $env:GITHUB_PATH
          "REPOT_REQUIRED_PROVIDERS=choco,npm,cargo,scoop" >> $env:GITHUB_ENV
          "REPOT_REQUIRED_ITEMS=scoop:main/jq,scoop:main/ripgrep" >> $env:GITHUB_ENV
      - name: Probe winget on the hosted image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if ($winget) {
            winget --version
            if ($LASTEXITCODE -ne 0) { throw 'Installed winget is not usable' }
            "REPOT_REQUIRED_PROVIDERS=$env:REPOT_REQUIRED_PROVIDERS,winget" >> $env:GITHUB_ENV
          } else {
            # Some Windows Server runner images do not include App Installer.
            # Do not treat an installed but broken winget as an optional skip.
            $reason = 'winget skipped: this hosted Windows image has no winget executable (App Installer is not provisioned).'
            Write-Host "::notice::$reason"
            $reason >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Record real Windows package-manager output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scoop export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget export -o "$env:RUNNER_TEMP/winget-real.json" --include-versions --accept-source-agreements --disable-interactivity
            if (Test-Path "$env:RUNNER_TEMP/winget-real.json") { Get-Content "$env:RUNNER_TEMP/winget-real.json" }
          }
      - name: Warm up Windows package managers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The first call of choco, npm and pipx on a fresh runner can exceed the
          # 30 s per-command timeout. real_scan checks real output parsing, not cold
          # start time, so run the same commands once and ignore their result.
          $calls = @(
            @('choco', 'list', '--limit-output'),
            @('npm', 'ls', '-g', '--depth=0', '--json'),
            @('npm', 'root', '-g'),
            @('pipx', 'list', '--json')
          )
          foreach ($call in $calls) {
            if (Get-Command $call[0] -ErrorAction SilentlyContinue) {
              $watch = [Diagnostics.Stopwatch]::StartNew()
              & $call[0] $call[1..($call.Length - 1)] *> $null
              Write-Host "$($call -join ' '): $([int]$watch.Elapsed.TotalSeconds) s"
            }
          }
          $global:LASTEXITCODE = 0
      - run: cargo test -p repot-core --test real_scan -- --ignored --nocapture

  linux-provider-scans:
    name: Real scan (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            provider: dnf
          - image: archlinux:base
            provider: pacman
    container: ${{ matrix.image }}
    env:
      REPOT_REQUIRED_PROVIDERS: ${{ matrix.provider }},cargo
      REPOT_REQUIRED_ITEMS: ${{ matrix.provider }}:jq,${{ matrix.provider }}:ripgrep
    steps:
      - name: Install build tools and seed explicit packages
        shell: bash
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y gcc git curl rust cargo jq ripgrep
          else
            pacman -Syu --noconfirm --needed base-devel git curl rust jq ripgrep
          fi
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Record real package-manager output
        shell: bash
        run: |
          if command -v dnf >/dev/null; then
            dnf repoquery --userinstalled --qf '%{name}|%{version}|%{summary}\n'
          else
            pacman -Qe
            pacman -Qi jq ripgrep
          fi
      # No Tauri dependencies or frontend: these containers build core only.
      - run: cargo build -p repot-core
      - run: cargo test -p repot-core --test real_scan -- --ignored --nocapture

  restore-e2e:
    name: Restore E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: ubuntu
          - os: windows-latest
            target: windows
    env:
      REPOT_E2E_TARGET: ${{ matrix.target }}
      # Do not spend the restore budget updating every Homebrew formula.
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh apt indexes
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - run: cargo test -p repot-core --example e2e_export
      - run: cargo build -p repot-core --example e2e_export
      - name: Install, fail, copy, then restore again
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess

          target = os.environ['REPOT_E2E_TARGET']
          root = Path(os.environ['RUNNER_TEMP']) / 'repot-e2e'
          root.mkdir()
          # A private empty npm prefix proves an install rather than reusing runner tools.
          os.environ['npm_config_prefix'] = str(root / 'npm')
          (root / 'npm' / ('node_modules' if target == 'windows' else 'lib/node_modules')).mkdir(parents=True)
          missing = 'repot-e2e-nonexistent-package-7f49c2'
          package = 'dos2unix' if target == 'windows' else 'sl'
          manager = {'macos': 'brew', 'ubuntu': 'apt-get', 'windows': 'choco'}[target]
          dest = Path.home() / '.repot-e2e'
          assert not dest.exists(), f'Config already exists: {dest}'

          def run(args):
              args = [str(a) for a in args]
              args[0] = shutil.which(args[0]) or args[0]
              result = subprocess.run(args, text=True, stdout=subprocess.PIPE,
                                      stderr=subprocess.STDOUT, timeout=180)
              print(f'$ {args}\n{result.stdout}\nexit: {result.returncode}', flush=True)
              return result

          def installed(name):
              if target == 'macos':
                  return run(['brew', 'list', '--formula', name]).returncode == 0
              if target == 'ubuntu':
                  r = run(['dpkg-query', '-W', '-f=${Status}', name])
                  return r.returncode == 0 and r.stdout == 'install ok installed'
              r = run(['choco', 'list', '--exact', name, '--limit-output'])
              assert r.returncode == 0, 'choco list failed'
              return any(line.lower().startswith(name.lower() + '|') for line in r.stdout.splitlines())

          def npm_installed():
              r = run(['npm', 'ls', '-g', '--depth=0', '--json'])
              assert r.returncode == 0, 'npm list failed'
              return 'is-odd' in json.loads(r.stdout).get('dependencies', {})

          # Never uninstall seeded runner tools to manufacture a clean-machine result.
          assert not installed(package), f'{package} is preinstalled; choose another fixture'
          assert not installed(missing), 'Deliberate failure unexpectedly exists'
          assert not npm_installed(), 'npm fixture is preinstalled'
          export = run(['cargo', 'run', '-q', '-p', 'repot-core', '--example',
                        'e2e_export', '--', target, root])
          assert export.returncode == 0, 'export failed'
          out = Path(export.stdout.strip())
          command = (['powershell', '-NoProfile', '-NonInteractive', '-ExecutionPolicy',
                      'Bypass', '-File', out / 'restore.ps1', '-Yes'] if target == 'windows'
                     else ['/bin/bash', out / 'restore.sh', '--yes'])
          labels = [f'{manager} install {package}', 'npm install -g is-odd',
                    'copy %USERPROFILE%\\.repot-e2e' if target == 'windows' else 'copy ~/.repot-e2e']
          for attempt in (1, 2):
              result = run(command)
              (root / f'restore-{attempt}.log').write_text(result.stdout, encoding='utf-8')
              assert result.returncode == 1, 'Partial failure must exit 1 (spec section 10)'
              summary = result.stdout.split('Summary\n', 1)[1]
              sections = re.fullmatch(r'OK:\n(.*?)Skipped:\n(.*?)Failed:\n(.*)', summary, re.S)
              assert sections, f'Malformed summary: {summary}'
              entries = lambda text: [line.strip()[2:] for line in text.splitlines() if line.strip()]
              ok, skipped, failed = map(entries, sections.groups())
              assert failed == [f'{manager} install {missing}'], f'Unexpected failures: {failed}'
              assert sorted(ok if attempt == 1 else skipped) == sorted(labels), summary
              assert not (skipped if attempt == 1 else ok), summary
              assert installed(package), 'Native package was not installed'
              assert not installed(missing), 'Deliberate failure was installed'
              assert npm_installed(), 'npm package was not installed'
              assert dest.read_bytes() == b'repot restore e2e\n', 'Config content differs'
              assert not list(dest.parent.glob('.repot-e2e.repot-backup-*')), 'Unchanged config was backed up'
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
                  report.write(f'### Restore {target}, run {attempt}\nExit: {result.returncode}\n```text\n{summary}```\n')
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: restore-e2e-${{ matrix.target }}
          path: ${{ runner.temp }}/repot-e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/check-version.test.mjs
      - run: pnpm --filter @repot/desktop typecheck
      - run: pnpm --filter @repot/desktop test
      - run: pnpm --filter @repot/desktop build
      - run: pnpm --filter @repot/site typecheck
      - run: pnpm --filter @repot/site test
      - run: pnpm --filter @repot/site build

  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p repot-core --example render_samples --example smoke_export
      - run: cargo run -p repot-core --example render_samples -- samples
      - name: Lint Bash samples
        if: runner.os == 'Linux'
        # SC1091 is informational: external nvm/sdkman sources are not present.
        # All warnings and errors still fail CI.
        run: shellcheck --severity=warning -s bash samples/restore-macos.sh samples/restore-linux.sh
      - name: Lint PowerShell sample
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path samples/restore.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          if ($r) { $r | Format-Table -AutoSize; exit 1 }
      - name: Restore smoke test (Bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p smoke smoke-home
          out=$(cargo run -q -p repot-core --example smoke_export -- smoke)
          export npm_config_prefix="$PWD/smoke-home/npm"
          HOME="$PWD/smoke-home" bash "$out/restore.sh" --yes
          test "$(cat smoke-home/.repot-smoke)" = "smoke"
          HOME="$PWD/smoke-home" bash "$out/restore.sh" --yes > smoke/second.log
          grep -q "skipped: copy ~/.repot-smoke" smoke/second.log
      - name: Restore smoke test (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $out = cargo run -q -p repot-core --example smoke_export -- smoke
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:npm_config_prefix = Join-Path $PWD 'smoke/npm'
          powershell -NoProfile -ExecutionPolicy Bypass -File "$out\restore.ps1" -Yes
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-Content "$HOME\.repot-smoke") -ne 'smoke') { exit 1 }
          $second = powershell -NoProfile -ExecutionPolicy Bypass -File "$out\restore.ps1" -Yes | Out-String
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($second -notmatch 'skipped: copy') { exit 1 }
