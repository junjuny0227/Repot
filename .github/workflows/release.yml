name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/check-version.test.mjs
      - run: node scripts/check-version.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          # 0.x releases are full releases (so they get "Latest" and releases/latest)
          # marked as beta in the name. tauri-action replaces __VERSION__.
          releaseName: Repot __VERSION__ (beta)
          # Prepended to GitHub's generated notes (PRs since the previous tag,
          # grouped by label per .github/release.yml). Edit the draft before publishing:
          # add a "## Highlights" section on top. updater-notes.yml turns it into the
          # plain-text note in latest.json once the release is published.
          # tauri-action replaces __VERSION__ in the body too (Repot___VERSION___x64.dmg → Repot_0.5.0_x64.dmg).
          releaseBody: |
            > **Unsigned beta.** Not code-signed or notarized yet; see the README for first launch on macOS and Windows.

            ### Which file do I download?

            | Your computer | Download |
            |---|---|
            | Mac with Apple silicon (M1 or later) | `Repot___VERSION___aarch64.dmg` |
            | Mac with Intel | `Repot___VERSION___x64.dmg` |
            | Windows | `Repot___VERSION___x64-setup.exe` |
            | Ubuntu, Debian | `Repot___VERSION___amd64.deb` |
            | Fedora, RHEL | `Repot-__VERSION__-1.x86_64.rpm` |
            | Other Linux | `Repot___VERSION___amd64.AppImage` |

            Not sure which Mac you have? Apple menu → **About This Mac**: "Chip Apple M…" means Apple silicon, "Processor Intel" means Intel.
            `.msi` is for managed Windows installs. Files ending in `.sig`, `.app.tar.gz` and `latest.json` are used by in-app updates; you don't need them.
          generateReleaseNotes: true
          uploadUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
