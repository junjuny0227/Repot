name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/check-version.test.mjs
      - run: node scripts/check-version.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          # 0.x releases are full releases (so they get "Latest" and releases/latest)
          # marked as beta in the name. tauri-action replaces __VERSION__.
          releaseName: Repot __VERSION__ (beta)
          # Prepended to GitHub's generated notes (PRs since the previous tag,
          # grouped by label per .github/release.yml). Edit the draft before publishing:
          # add a "## Highlights" section on top. updater-notes.yml turns it into the
          # plain-text note in latest.json once the release is published.
          # tauri-action replaces __VERSION__ in the body too (Repot___VERSION___x64.dmg → Repot_0.5.0_x64.dmg);
          # links point at this release's assets so a click downloads the file.
          releaseBody: |
            > **Unsigned beta.** Not code-signed or notarized yet; see the README for first launch on macOS and Windows.

            ### Which file do I download?

            | Your computer | Download |
            |---|---|
            | Mac with Apple silicon (M1 or later) | [`Repot___VERSION___aarch64.dmg`](${{ github.server_url }}/${{ github.repository }}/releases/download/v__VERSION__/Repot___VERSION___aarch64.dmg) |
            | Mac with Intel | [`Repot___VERSION___x64.dmg`](${{ github.server_url }}/${{ github.repository }}/releases/download/v__VERSION__/Repot___VERSION___x64.dmg) |
            | Windows | [`Repot___VERSION___x64-setup.exe`](${{ github.server_url }}/${{ github.repository }}/releases/download/v__VERSION__/Repot___VERSION___x64-setup.exe) |
            | Ubuntu, Debian | [`Repot___VERSION___amd64.deb`](${{ github.server_url }}/${{ github.repository }}/releases/download/v__VERSION__/Repot___VERSION___amd64.deb) |
            | Fedora, RHEL | [`Repot-__VERSION__-1.x86_64.rpm`](${{ github.server_url }}/${{ github.repository }}/releases/download/v__VERSION__/Repot-__VERSION__-1.x86_64.rpm) |
            | Other Linux | [`Repot___VERSION___amd64.AppImage`](${{ github.server_url }}/${{ github.repository }}/releases/download/v__VERSION__/Repot___VERSION___amd64.AppImage) |

            Command-line tool: `repot-cli-__VERSION__-<target>.tar.gz` (macOS, Linux) or `.zip` (Windows), each with a `.sha256` file; see the README.

            Not sure which Mac you have? Apple menu → **About This Mac**: "Chip Apple M…" means Apple silicon, "Processor Intel" means Intel.
            `.msi` is for managed Windows installs. Files ending in `.sig`, `.app.tar.gz` and `latest.json` are used by in-app updates; you don't need them.
          generateReleaseNotes: true
          uploadUpdaterJson: true
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The repot command-line tool (plan 15), uploaded to the draft the build job created.
  cli:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - run: cargo build --release --locked -p repot-cli --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="repot-cli-${TAG#v}-$TARGET"
          mkdir "$name"
          cp LICENSE "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/repot.exe" "$name/"
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            cp "target/$TARGET/release/repot" "$name/"
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          # The version the binary reports must be the tag's.
          if [[ "$TARGET" != x86_64-apple-darwin ]]; then
            test "$("$name/repot" --version)" = "repot ${TAG#v}"
          fi
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum='shasum -a 256'; fi
          $sum "$archive" > "$archive.sha256"
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber
