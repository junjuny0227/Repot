[package]
name = "repot-desktop"
version = "0.1.0"
edition = "2024"

[lib]
name = "repot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
repot-core = { path = "../../../crates/core" }
